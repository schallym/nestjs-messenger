name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck

  unit:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    # Transport packages test against a real broker (the conformance suite), so the
    # coverage job needs Redis and the Pub/Sub emulator. Other packages ignore them.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
      pubsub:
        image: messagebird/gcloud-pubsub-emulator:latest
        ports:
          - 8685:8681
        options: >-
          --health-cmd "curl -sf http://localhost:8681/ || exit 1"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:coverage
        env:
          REDIS_DSN: redis://localhost:6379
          PUBSUB_EMULATOR_HOST: localhost:8685
          PUBSUB_PROJECT_ID: messenger-test
      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          files: packages/*/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  e2e:
    name: E2E (docker-compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Start brokers
        run: docker compose -f e2e/docker-compose.yml up -d --wait
      - name: Run e2e
        run: pnpm test:e2e
        env:
          REDIS_DSN: redis://localhost:6379
          PUBSUB_EMULATOR_HOST: localhost:8685
          PUBSUB_PROJECT_ID: messenger-test
      - name: Stop brokers
        if: always()
        run: docker compose -f e2e/docker-compose.yml down -v
