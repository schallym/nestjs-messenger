version: 2

updates:
  # npm/pnpm dependencies. Dependabot must run from the workspace root, where
  # pnpm-lock.yaml and pnpm-workspace.yaml live: from there it reads every workspace
  # manifest (packages/* and e2e) and bumps a dependency in all of them plus the lockfile
  # in one PR. Do NOT list subdirectories: Dependabot does not support updating a pnpm
  # workspace from inside it, and opens manifest-only PRs that fail
  # `pnpm install --frozen-lockfile`.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    # Conventional-commit prefixes so release-please reacts correctly:
    #   runtime deps -> `fix(deps): …`  (cuts a patch release for the affected package)
    #   dev deps     -> `chore(deps-dev): …`  (tooling only, no release)
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    # Internal workspace packages are versioned by release-please (node-workspace plugin),
    # so Dependabot must not try to bump the cross-package peer/dev ranges.
    ignore:
      - dependency-name: '@schally/*'
    # Bundle non-breaking dev-dependency bumps into a single PR to cut noise; runtime
    # deps stay as individual PRs so each maps to its own clean patch release.
    groups:
      # NestJS core packages peer on each other at the same major (platform-express@12
      # requires core@12 / common@12), and nest-commander pins its supported Nest majors.
      # Bump them together, majors included, so Dependabot never opens a PR that bumps one
      # without the others.
      nestjs:
        patterns:
          - '@nestjs/*'
          - nest-commander
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
        # Dependabot assigns a dependency to its most specific matching group, not the
        # first one, and ranks this group above `nestjs`: exclude the Nest packages here.
        exclude-patterns:
          - '@nestjs/*'
          - nest-commander

  # Keep the actions used by the CI and release workflows current.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - '*'
