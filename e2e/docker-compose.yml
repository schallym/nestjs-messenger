# Shared broker harness for E2E — used by BOTH CI and local dev (`pnpm dev:brokers`).
# Each transport package that needs a real backend adds its service here.
services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 10

  # Google Cloud Pub/Sub emulator for @schally/nestjs-messenger-transport-google-pubsub.
  # Clients connect via PUBSUB_EMULATOR_HOST=localhost:8685 (no credentials needed).
  pubsub:
    image: messagebird/gcloud-pubsub-emulator:latest
    ports:
      - '8685:8681'
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:8681/ || exit 1']
      interval: 2s
      timeout: 2s
      retries: 20
