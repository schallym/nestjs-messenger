# Shared broker harness for E2E — used by BOTH CI and local dev (`pnpm dev:brokers`).
# Each transport package that needs a real backend adds its service here.
services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 10

  # Google Cloud Pub/Sub emulator for @schally/nestjs-messenger-transport-google-pubsub.
  # Clients connect via PUBSUB_EMULATOR_HOST=localhost:8685 (no credentials needed).
  pubsub:
    image: messagebird/gcloud-pubsub-emulator:latest
    ports:
      - '8685:8681'
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:8681/ || exit 1']
      interval: 2s
      timeout: 2s
      retries: 20

  # PostgreSQL for @schally/nestjs-messenger-transport-sql (postgres dialect).
  # Clients connect via postgresql://messenger:messenger@localhost:5432/messenger.
  postgres:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: messenger
      POSTGRES_DB: messenger
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U messenger -d messenger']
      interval: 2s
      timeout: 2s
      retries: 15

  # MySQL for @schally/nestjs-messenger-transport-sql (mysql dialect; ≥ 8.0.1 for
  # SKIP LOCKED). Clients connect via mysql://messenger:messenger@localhost:3306/messenger.
  mysql:
    image: mysql:8.4
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: messenger
      MYSQL_USER: messenger
      MYSQL_PASSWORD: messenger
      MYSQL_DATABASE: messenger
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -umessenger -pmessenger --silent']
      interval: 2s
      timeout: 4s
      retries: 30
      start_period: 20s

  # Single-node Apache Kafka (KRaft, no Zookeeper) for
  # @schally/nestjs-messenger-transport-kafka. Clients connect to localhost:9092.
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - '9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # No rebalance delay so consumer groups join immediately (faster tests).
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Generous message size so the conformance large-payload (1 MB) scenario fits.
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      KAFKA_REPLICA_FETCH_MAX_BYTES: 10485760
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1',
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s
